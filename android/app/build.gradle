import java.util.Properties
import java.io.FileInputStream
import java.io.File

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.network.proxy"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
//    ndkVersion "26.1.10909125"

    compileOptions {
        // GeckoView 使用 Java 17 API。
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    packagingOptions {
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    defaultConfig {
        applicationId "com.network.proxy"
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // GeckoView 141 官方最低要求 Android 8.0 / API 26；不使用 overrideLibrary 强行兼容，避免旧系统运行时崩溃。
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // All release APKs use the unified yangyu91 signing identity.
            signingConfig signingConfigs.release

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

// Set a fixed APK name for release builds
// Use the older ApplicationVariants API which is compatible across AGP versions
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            def apkName = "proxypin-android.apk"
            try {
                // Newer output API
                output.outputFileName = apkName
            } catch (Exception e) {
                // Fallback for older API
                output.outputFile = new File(output.outputFile.parent, apkName)
            }
        }
    }
}

dependencies {
    // Mozilla Firefox 浏览器内核，供内置 GeckoView 浏览器使用。
    // 141.x 使用 Kotlin 2.1.x 与 AndroidX Core 1.16，兼容当前 Kotlin/AGP 工具链和 compileSdk 36；
    // 同时保留 GeckoRuntimeSettings.enterpriseRootsEnabled 与 configFilePath。
    implementation 'org.mozilla.geckoview:geckoview:141.0.20250806102122'
    // 2dust AndroidLibXrayLite：嵌入式 Xray Core，包含 armeabi-v7a、arm64-v8a 和 x86_64 JNI。
    // 由 GitHub Actions 从受版本锁定的仓库文件构建，不在运行时下载可执行代码。
    implementation files('libs/libv2ray.aar')
}
